version: "3.8"

services:
  # PostgreSQL database
  postgres:
    image: postgres:17-alpine
    container_name: flower-shop-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flower_shop
    ports:
      - "5432:5432"
    volumes:
      # Named volume: persists data even if container is deleted
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ASP.NET Core API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flower-shop-api
    environment:
      # Connection string for PostgreSQL in Docker
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=flower_shop;Username=postgres;Password=postgres"
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:7185"
    ports:
      - "7185:7185"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Bind mount for hot reload (optional, for development)
      - ./Flower-shop.Server:/app/Flower-shop.Server
      - ./SweetFlowerShop.Application:/app/SweetFlowerShop.Application
      - ./SweetFlowerShop.Domain:/app/SweetFlowerShop.Domain
      - ./SweetFlowerShop.Infrastructure:/app/SweetFlowerShop.Infrastructure

volumes:
  postgres_data:
