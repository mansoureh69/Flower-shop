<section class="delivery" id="delivery" aria-labelledby="delivery-title">
  <div class="delivery__heading">
    <p>Our promise</p>
    <h2 id="delivery-title">A more thoughtful way to send flowers.</h2>
  </div>

  <ol class="delivery__benefits">
    @for (benefit of benefits(); track benefit.number) {
      <li>
        <span aria-hidden="true">{{ benefit.number }}</span>
        <div>
          <h3>{{ benefit.title }}</h3>
          <p>{{ benefit.description }}</p>
        </div>
      </li>
    }
  </ol>
</section>
