name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Flower-shop.slnx

      - name: Build solution
        run: dotnet build Flower-shop.slnx --configuration Release --no-restore

      - name: Run backend tests
        run: >-
          dotnet test Flower-shop.slnx
          --configuration Release
          --no-build
          --logger trx
          --results-directory TestResults
          --collect:"XPlat Code Coverage"

      - name: Upload backend test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 14

      - name: Upload server build artifact
        uses: actions/upload-artifact@v7
        with:
          name: flower-shop-server-build
          path: Flower-shop.Server/bin/Release/net10.0
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: flower-shop.client

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: flower-shop.client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --watch=false

      - name: Build production client
        run: npm run build

      - name: Upload client artifact
        uses: actions/upload-artifact@v7
        with:
          name: flower-shop-client
          path: flower-shop.client/dist/flower-shop.client/browser
          if-no-files-found: error
          retention-days: 14
